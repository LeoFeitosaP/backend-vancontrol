spring.application.name=VanControl

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/VanControl}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

api.security.token.secret=${JWT_SECRET}

app.admin.email=${APP_ADMIN_EMAIL}
app.admin.name=${APP_ADMIN_NAME:Administrador}
app.admin.password=${APP_ADMIN_PASSWORD}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

integracao.nominatim.url=https://nominatim.openstreetmap.org
integracao.nominatim.user-agent=${NOMINATIM_USER_AGENT:VanControl-Academic-Project}
integracao.osrm.url=https://router.project-osrm.org